<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
    <defs>
        <linearGradient id="ll-sky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e1b4b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
    </defs>
    <rect width="600" height="360" fill="url(#ll-sky)"/>
    <!-- Observatory Dome -->
    <path d="M 230,220 C 230,130 370,130 370,220 Z" fill="#334155"/>
    <rect x="220" y="220" width="160" height="70" fill="#1e293b"/>
    <line x1="270" y1="130" x2="330" y2="130" stroke="#38bdf8" stroke-width="4"/>
    <!-- Network Beams -->
    <circle cx="120" cy="140" r="16" fill="#38bdf8"/>
    <circle cx="480" cy="140" r="16" fill="#818cf8"/>
    <line x1="136" y1="140" x2="280" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
    <line x1="464" y1="140" x2="320" y2="170" stroke="#818cf8" stroke-width="2" stroke-dasharray="4"/>
    <!-- Text -->
    <rect x="20" y="20" width="160" height="32" rx="6" fill="#4338ca"/>
    <text x="32" y="42" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#ffffff">LONGLINK</text>
    <text x="20" y="320" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="24" fill="#ffffff">Private WebRTC Network</text>
    <text x="20" y="342" font-family="'Segoe UI', sans-serif" font-size="14" fill="#a5b4fc">Django • Channels • Real-Time WebRTC Media</text>
</svg>
