<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080c14"/>
            <stop offset="50%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e1b4b"/>
        </linearGradient>
        <radialGradient id="glow" cx="60%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="island" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#22c55e"/>
            <stop offset="30%" stop-color="#15803d"/>
            <stop offset="70%" stop-color="#78350f"/>
            <stop offset="100%" stop-color="#451a03"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="750" cy="280" r="350" fill="url(#glow)"/>
    
    <!-- Floating Island Silhouette -->
    <path d="M 650,340 C 720,300 880,310 980,350 C 950,440 850,510 780,530 C 730,470 670,410 650,340 Z" fill="url(#island)"/>
    <!-- Lighthouse beam -->
    <polygon points="930,260 1200,100 1200,220" fill="#fef08a" opacity="0.25"/>
    <rect x="925" y="250" width="15" height="40" fill="#f8fafc"/>
    <polygon points="920,250 932,225 945,250" fill="#dc2626"/>

    <!-- Text Content -->
    <rect x="80" y="80" width="220" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
    <circle cx="102" cy="98" r="6" fill="#10b981"/>
    <text x="118" y="103" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="2">SAALIM'S WORLD</text>

    <text x="80" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#f8fafc">MOHAMMED SAALIM</text>
    <text x="80" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="24" fill="#38bdf8" letter-spacing="1">ASPIRING FULL-STACK DEVELOPER | COMPUTER SCIENCE ENGINEER</text>
    <text x="80" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">B.E. Computer Science &amp; Engineering • Sri Siddhartha Institute of Technology (SSIT), Tumakuru</text>

    <!-- Key highlights pills -->
    <g transform="translate(80, 360)">
        <rect width="180" height="44" rx="8" fill="#0f766e" opacity="0.6"/>
        <text x="20" y="28" font-family="sans-serif" font-size="15" font-weight="600" fill="#ffffff">🌱 AgroSense IoT</text>

        <rect x="195" width="200" height="44" rx="8" fill="#1d4ed8" opacity="0.6"/>
        <text x="215" y="28" font-family="sans-serif" font-size="15" font-weight="600" fill="#ffffff">⚡ Django &amp; MySQL</text>

        <rect x="410" width="180" height="44" rx="8" fill="#7c3aed" opacity="0.6"/>
        <text x="430" y="28" font-family="sans-serif" font-size="15" font-weight="600" fill="#ffffff">🏆 SSIT Hackathon</text>
    </g>

    <text x="80" y="550" font-family="monospace" font-size="16" fill="#64748b">Tumakuru, Karnataka, India • Batch 2027 • CGPA: 7.44</text>
</svg>
