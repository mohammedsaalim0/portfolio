<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
    <defs>
        <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffbeb"/>
            <stop offset="100%" stop-color="#fef3c7"/>
        </linearGradient>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="50%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
    </defs>
    <!-- Certificate Border Frame -->
    <rect width="800" height="560" rx="8" fill="url(#parchment)"/>
    <rect x="24" y="24" width="752" height="512" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <rect x="36" y="36" width="728" height="488" fill="none" stroke="#78350f" stroke-width="1.5" stroke-dasharray="8,4"/>

    <!-- Header -->
    <text x="400" y="110" font-family="'Times New Roman', Georgia, serif" font-weight="700" font-size="36" fill="#78350f" text-anchor="middle" letter-spacing="4">CERTIFICATE OF RECOGNITION</text>
    <text x="400" y="145" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#92400e" text-anchor="middle" letter-spacing="2">SRI SIDDHARTHA INSTITUTE OF TECHNOLOGY (SSIT)</text>

    <line x1="250" y1="165" x2="550" y2="165" stroke="url(#gold)" stroke-width="2"/>

    <!-- Recipient -->
    <text x="400" y="215" font-family="'Segoe UI', sans-serif" font-size="16" fill="#57534e" text-anchor="middle">This is proudly presented to</text>
    <text x="400" y="275" font-family="'Times New Roman', Georgia, serif" font-weight="700" font-size="44" fill="#1e293b" text-anchor="middle">Mohammed Saalim</text>
    <line x1="220" y1="290" x2="580" y2="290" stroke="#94a3b8" stroke-width="1"/>

    <!-- Achievement details -->
    <text x="400" y="335" font-family="'Segoe UI', sans-serif" font-size="17" fill="#475569" text-anchor="middle">In honor of outstanding performance in the SSIT Hackathon with project</text>
    <text x="400" y="370" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="22" fill="#047857" text-anchor="middle">Smart Farmer Crop Advisory System (AgroSense)</text>
    <text x="400" y="405" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="16" fill="#b45309" text-anchor="middle">Award: ₹2,000 Cash Prize &amp; Certificate of Merit</text>

    <!-- Verified Badge / Seal -->
    <circle cx="160" cy="460" r="42" fill="url(#gold)"/>
    <circle cx="160" cy="460" r="36" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="160" y="455" font-family="sans-serif" font-weight="900" font-size="11" fill="#78350f" text-anchor="middle">VERIFIED</text>
    <text x="160" y="470" font-family="sans-serif" font-weight="800" font-size="9" fill="#78350f" text-anchor="middle">CREDENTIAL</text>

    <!-- FlipLink watermark link indicator -->
    <text x="640" y="470" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">View online via FlipLink</text>
    <text x="640" y="490" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">ID: B181FFD7-3226-4F09</text>
</svg>
