            <stop offset="0%" stop-color="#450a0a"/>
            <stop offset="100%" stop-color="#18181b"/>
        </linearGradient>
    </defs>
    <rect width="600" height="360" fill="url(#f1-sky)"/>
    <!-- Curving Race Track with Apex Kerbs -->
    <path d="M 0,280 C 150,280 200,210 320,210 C 420,210 480,260 600,260" stroke="#27272a" stroke-width="60" fill="none"/>
    <path d="M 0,280 C 150,280 200,210 320,210 C 420,210 480,260 600,260" stroke="#e11d48" stroke-width="4" stroke-dasharray="16,8" fill="none"/>
    <!-- Ferrari Red Silhouette Accent -->
