    <text x="20" y="320" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="24" fill="#ffffff">Motorsport Telemetry &amp; Simulation</text>
    <text x="20" y="342" font-family="'Segoe UI', sans-serif" font-size="14" fill="#fca5a5">Aerodynamics • Real-Time Telemetry Gauges • Three.js</text>
