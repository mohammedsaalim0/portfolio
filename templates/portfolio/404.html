{% extends "base.html" %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 100;">
    <div style="background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border-glow); border-radius: 20px; padding: 48px 36px; max-width: 540px; text-align: center; box-shadow: var(--shadow-elevation);">
        <div style="font-size: 64px; font-weight: 900; font-family: var(--font-heading); color: var(--color-primary); margin-bottom: 8px;">404</div>
        <h1 style="font-family: var(--font-heading); font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 12px;">Lost in the Clouds</h1>
        <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 28px; line-height: 1.6;">
            The coordinates you navigated to do not exist on Saalim's floating island. Return safely to the main entrance gate.
        </p>
        <a href="{% url 'portfolio:index' %}" class="btn-cta primary" style="display: inline-flex;">
            Return to Saalim's World →
        </a>
    </div>
</div>
{% endblock %}
